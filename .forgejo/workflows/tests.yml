name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Ward
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate advisory registry
        run: python -m emuwatch validate
      - name: Compile Python sources
        run: python -m compileall -q src

  web:
    name: Web assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check src/emuwatch/webui/app.js
      - name: Run Ward integrity checks
        run: node tools/ci-check.mjs

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ward-ci .
      - name: Verify installed package and non-root user
        run: |
          docker run --rm --entrypoint python ward-ci -c "import emuwatch; from importlib.metadata import version; assert emuwatch.__version__ == version('ward-github-scanner')"
          test "$(docker run --rm --entrypoint id ward-ci -u)" = "10001"
