[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ward-github-scanner"
version = "0.6.0"
description = "A public Git repository scanner backed by exact malware evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HiLleywyn" }]
dependencies = []

[project.scripts]
ward = "ward.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ward = ["webui/*", "advisories/*.json", "openapi.json", "windows_guest.ps1"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

