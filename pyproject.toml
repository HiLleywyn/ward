[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emulator-safety-watch"
version = "0.2.1"
description = "A metadata-only checker for emulator download impersonation and known malware indicators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HiLleywyn" }]
dependencies = []

[project.scripts]
emuwatch = "emuwatch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emuwatch = ["webui/*", "advisories/*.json"]

